name: Feature request
description: Propose a focused, simulator-neutral capability.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe the workflow limitation without prescribing code.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed observable behavior
      description: Include example input, output, and compatibility expectations.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: true
