name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_PROJECT_NAME: regressistor
  RELEASE_PROJECT_VERSION: "0.5.0"
  RELEASE_SYFT_VERSION: "1.51.1"

jobs:
  verify-ci:
    name: Require main ancestry and successful CI
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Verify tag commit is reachable from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *) echo "release workflow must run from a version tag, not $GITHUB_REF" >&2; exit 1 ;;
          esac
          git fetch --no-tags origin main
          test "$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")" = tag
          git show origin/main:.github/allowed_signers > "$RUNNER_TEMP/allowed_signers"
          git config gpg.format ssh
          git config gpg.ssh.allowedSignersFile "$RUNNER_TEMP/allowed_signers"
          git verify-tag "$GITHUB_REF_NAME"
          resolved="$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{}")"
          if [ "$resolved" != "$GITHUB_SHA" ]; then
            echo "tag target differs from the workflow commit" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "release commit is not reachable from origin/main" >&2
            exit 1
          }
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA" \
            --jq .commit.verification.verified)" = true || {
            echo "release commit does not have a GitHub-verified signature" >&2
            exit 1
          }
      - name: Wait for the complete CI workflow on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            successful="$(gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .event == \"push\" and .head_branch == \"main\" and .head_sha == \"$GITHUB_SHA\")] | length")"
            if [ "$successful" -gt 0 ]; then
              echo "verified successful CI workflow for $GITHUB_SHA"
              exit 0
            fi
            echo "CI has not succeeded yet (attempt $attempt/90)"
            sleep 20
          done
          echo "no successful complete CI workflow found for $GITHUB_SHA" >&2
          exit 1

  build:
    name: Build and verify distributions
    needs: verify-ci
    if: needs.verify-ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up exact Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11.16"
      - name: Set up checksum-verified uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.21"
          checksum: 8c88519b0ef0af9801fcdee419bbb12116bd9e6b18e162ae093c932d8b264050
          enable-cache: false
          download-from-astral-mirror: false
      - name: Install frozen development environment
        run: uv sync --frozen --extra dev
      - name: Run release quality gate
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy --python-version 3.11 src
          uv run --frozen bandit -q -r src
          uv run --frozen pytest --cov=regressistor --cov-branch --cov-report=term-missing
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          expected_version = os.environ["RELEASE_PROJECT_VERSION"]
          if version != expected_version:
              raise SystemExit(
                  f"project version {version!r} does not match workflow version {expected_version!r}"
              )
          expected = f"v{version}"
          if os.environ["RELEASE_TAG"] != expected:
              raise SystemExit(
                  f"release tag {os.environ['RELEASE_TAG']!r} does not match {expected!r}"
              )
          print(f"validated project version {version}")
          PY
      - name: Fix build timestamp to the source commit
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build from a clean output directory
        run: |
          rm -rf dist build
          uv run --frozen python -m build --no-isolation
      - name: Validate distribution metadata and shape
        run: |
          uv run --frozen python -m twine check --strict dist/*
          uv run --frozen python -I - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          from regressistor.distribution_audit import audit_sdist, audit_wheel

          wheels = tuple(Path("dist").glob("*.whl"))
          sdists = tuple(Path("dist").glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1 or len(tuple(Path("dist").iterdir())) != 2:
              raise SystemExit("expected exactly one wheel and one .tar.gz source distribution")
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = audit_sdist(archive)
          required_source = {
              ".github/allowed_signers",
              ".github/workflows/ci.yml",
              ".github/workflows/dco.yml",
              ".github/workflows/release.yml",
              "CITATION.cff",
              "benchmarks/manifest.json",
              "benchmarks/fixtures/simcairn-offline-golden.json",
              "benchmarks/fixtures/simcairn-ngspice-42.json",
              "benchmarks/fixtures/simcairn-sky130-ngspice42.json",
              "benchmarks/fixtures/simcairn-gf180-ngspice42.json",
              "benchmarks/evidence/simcairn-rc-manifest.json",
              "benchmarks/evidence/simcairn-sky130-manifest.json",
              "benchmarks/evidence/simcairn-gf180-manifest.json",
              "docs/schemas/measurement-bundle-1.schema.json",
              "docs/schemas/measurement-bundle-2.schema.json",
              "docs/liberty-nldm.md",
              "docs/validation.md",
              "benchmarks/liberty_nldm_benchmark.py",
              "benchmarks/waveform_scale.py",
              "benchmarks/waveform_simulator_oracle.py",
              "benchmarks/evidence/waveform-ngspice42-v050-20260909.json",
              "benchmarks/results/waveform-v050-scalar-regression-final-20260909.json",
              "benchmarks/results/waveform-scale-v050-exact-100k-windows-final-20260909.json",
              "benchmarks/results/waveform-scale-v050-floor-100k-windows-final-20260909.json",
              "docs/waveforms.md",
              "docs/waveform-simulator-oracle.md",
              "examples/waveform/generate.py",
              "tests/test_waveform.py",
              "tests/test_waveform_json.py",
              "tests/test_waveform_oracle.py",
              "tests/test_waveform_adversarial.py",
              "tests/test_waveform_wire_oracle.py",
              "tests/test_waveform_simulator_oracle.py",
              "tests/test_waveform_workflow.py",
              "tests/test_waveform_example.py",
              "tests/test_waveform_scale.py",
              "tests/fixtures/synthetic_nldm.lib",
              "tools/verify_openram_liberty.py",
              "src/regressistor/dco.py",
              "src/regressistor/distribution_audit.py",
              "src/regressistor/liberty.py",
              "src/regressistor/waveform.py",
              "src/regressistor/waveform_json.py",
              "src/regressistor/schemas/waveform-v1.schema.json",
              "src/regressistor/schemas/waveform-policy-v1.schema.json",
              "src/regressistor/schemas/waveform-comparison-v1.schema.json",
              "src/regressistor/release_artifacts.py",
              "tests/test_release_artifacts.py",
              "tests/test_release_workflow.py",
              "tests/test_standalone_workflows.py",
              "tests/test_workflow_security.py",
              "uv.lock",
          }
          if missing := required_source - names:
              raise SystemExit(f"source distribution is missing: {sorted(missing)}")
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = audit_wheel(archive)
          required_wheel = {
              "regressistor/_version.py",
              "regressistor/distribution_audit.py",
              "regressistor/liberty.py",
              "regressistor/waveform.py",
              "regressistor/waveform_json.py",
              "regressistor/schemas/waveform-v1.schema.json",
              "regressistor/schemas/waveform-policy-v1.schema.json",
              "regressistor/schemas/waveform-comparison-v1.schema.json",
              "regressistor/release_artifacts.py",
              "regressistor/py.typed",
          }
          if missing := required_wheel - wheel_names:
              raise SystemExit(f"wheel is missing: {sorted(missing)}")
          PY
      - name: Run the full suite from the exact source distribution
        run: |
          set -euo pipefail
          source_root="$(mktemp -d "$RUNNER_TEMP/regressistor-sdist.XXXXXX")"
          python -I - "$source_root" "dist/regressistor-$RELEASE_PROJECT_VERSION.tar.gz" <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          destination = Path(sys.argv[1]).resolve(strict=True)
          archive_path = Path(sys.argv[2]).resolve(strict=True)
          with tarfile.open(archive_path, "r:gz") as archive:
              archive.extractall(destination, filter="data")
          PY
          cd "$source_root/regressistor-$RELEASE_PROJECT_VERSION"
          uv sync --frozen --extra dev
          uv run --frozen pytest --cov=regressistor --cov-branch --cov-report=term-missing
      - name: Install wheel and smoke-check metadata and CLI version
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --disable-pip-version-check --no-deps dist/*.whl
          .release-smoke/bin/python -I - <<'PY'
          import contextlib
          import json
          import subprocess
          import tempfile
          from pathlib import Path
          from importlib.metadata import version
          from importlib.resources import files

          launcher = Path(".release-smoke/bin/regressistor").resolve(strict=True)
          fixture = Path("tests/fixtures/synthetic_nldm.lib").resolve(strict=True)
          installation = launcher.parent.parent
          with tempfile.TemporaryDirectory() as directory, contextlib.chdir(directory):
              import regressistor

              if not Path(regressistor.__file__).resolve().is_relative_to(installation):
                  raise SystemExit("wheel smoke imported a package outside its installation")
              expected = version("regressistor")
              if regressistor.__version__ != expected:
                  raise SystemExit("runtime and distribution versions differ")
              completed = subprocess.run(
                  [str(launcher), "--version"],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              if completed.stdout.strip() != f"regressistor {expected}":
                  raise SystemExit("CLI version does not match distribution metadata")
              output = Path(directory) / "liberty.json"
              subprocess.run(
                  [
                      str(launcher),
                      "import-liberty",
                      "--input",
                      str(fixture),
                      "--out",
                      str(output),
                  ],
                  check=True,
                  capture_output=True,
                  text=True,
              )
              converted = json.loads(output.read_text(encoding="utf-8"))
              if converted["run"]["contract"] != "regressistor.liberty-nldm/1":
                  raise SystemExit("installed Liberty conversion contract is invalid")
              if len(converted["points"]) != 33:
                  raise SystemExit("installed Liberty conversion point count is invalid")
              for name in ("waveform-v1", "waveform-policy-v1", "waveform-comparison-v1"):
                  schema = json.loads(files("regressistor").joinpath(
                      f"schemas/{name}.schema.json"
                  ).read_text(encoding="utf-8"))
                  if schema["$schema"] != "https://json-schema.org/draft/2020-12/schema":
                      raise SystemExit("installed waveform schema has the wrong dialect")
              baseline = regressistor.Waveform((0, 1), (-1, 1), "s", "V")
              candidate = regressistor.Waveform((0, 1), (-1.125, 0.875), "s", "V")
              policy = regressistor.WaveformPolicy(relative=0.25, grid="linear")
              root = Path(directory)
              baseline_path = root / "baseline.json"
              candidate_path = root / "candidate.json"
              policy_path = root / "policy.json"
              report_path = root / "waveform-report.json"
              regressistor.write_waveform(baseline, baseline_path)
              regressistor.write_waveform(candidate, candidate_path)
              regressistor.write_waveform_policy(policy, policy_path)
              arguments = [
                  str(launcher), "waveform-check",
                  "--policy", str(policy_path), "--baseline", str(baseline_path),
                  "--candidate", str(candidate_path),
              ]
              checked = subprocess.run(
                  [*arguments, "--out", str(report_path)],
                  check=False, capture_output=True, text=True,
              )
              waveform_report = json.loads(report_path.read_text(encoding="utf-8"))
              if (
                  checked.returncode != 1 or checked.stderr
                  or waveform_report["status"] != "fail"
                  or waveform_report["evaluated_breakpoints"] != 3
                  or waveform_report["failing_breakpoints"] != 1
                  or waveform_report["maximum_excess"]["axis"] != {
                      "numerator": "0x1", "denominator": "0x2"
                  }
              ):
                  raise SystemExit("installed waveform CLI missed the interior zero-crossing failure")
              protected_bytes = baseline_path.read_bytes()
              protected = subprocess.run(
                  [*arguments, "--out", str(baseline_path), "--force"],
                  check=False, capture_output=True, text=True,
              )
              if protected.returncode != 3 or baseline_path.read_bytes() != protected_bytes:
                  raise SystemExit("installed waveform CLI failed to protect its input")
          PY
          site_packages="$(.release-smoke/bin/python -I -c 'import sysconfig; print(sysconfig.get_path("purelib"))')"
          installation_root="$(realpath .release-smoke)"
          workspace_root="$(realpath "$GITHUB_WORKSPACE")"
          if [ "$installation_root" != "$workspace_root/.release-smoke" ]; then
            echo "release virtual environment resolved outside its expected root" >&2
            exit 1
          fi
          case "$site_packages" in
            "$installation_root"/*) ;;
            *) echo "installed site-packages escaped the release virtual environment" >&2; exit 1 ;;
          esac
          echo "RELEASE_INSTALLATION_ROOT=$installation_root" >> "$GITHUB_ENV"
          echo "RELEASE_SITE_PACKAGES=$site_packages" >> "$GITHUB_ENV"
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        env:
          SYFT_CHECK_FOR_APP_UPDATE: "false"
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_SOURCE_NAME: ${{ env.RELEASE_PROJECT_NAME }}
          SYFT_SOURCE_VERSION: ${{ env.RELEASE_PROJECT_VERSION }}
        with:
          path: .release-smoke
          format: spdx-json
          output-file: dist/SBOM.spdx.json
          syft-version: v${{ env.RELEASE_SYFT_VERSION }}
          upload-artifact: false
          upload-release-assets: false
      - name: Bind and validate the installed-wheel SBOM and release checksums
        run: |
          uv run --frozen python -I src/regressistor/release_artifacts.py bind-installed-wheel \
            --sbom dist/SBOM.spdx.json \
            --site-packages "$RELEASE_SITE_PACKAGES" \
            --installation-root "$RELEASE_INSTALLATION_ROOT" \
            --expected-external-path "bin/regressistor" \
            --wheel "dist/regressistor-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -I src/regressistor/release_artifacts.py validate-sbom \
            --sbom dist/SBOM.spdx.json \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
          uv run --frozen python -I src/regressistor/release_artifacts.py write-checksums \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION"
          uv run --frozen python -I src/regressistor/release_artifacts.py verify-release \
            --directory dist \
            --name "$RELEASE_PROJECT_NAME" \
            --version "$RELEASE_PROJECT_VERSION" \
            --syft-version "$RELEASE_SYFT_VERSION"
      - name: Upload verified distributions and release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-distributions
          path: |
            dist/regressistor-${{ env.RELEASE_PROJECT_VERSION }}-py3-none-any.whl
            dist/regressistor-${{ env.RELEASE_PROJECT_VERSION }}.tar.gz
            dist/SBOM.spdx.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Attest build provenance
    if: github.event_name == 'push' && github.event.repository.visibility == 'public'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I src/regressistor/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Attest verified distributions
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

  github-release:
    name: Create GitHub release
    if: >-
      ${{ github.event_name == 'push' && always() && needs.build.result == 'success' &&
      (needs.provenance.result == 'success' || needs.provenance.result == 'skipped') }}
    needs: [build, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the verified release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download verified distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-distributions
          path: dist
      - name: Re-verify downloaded release assets
        run: >-
          python -I src/regressistor/release_artifacts.py verify-release
          --directory dist
          --name "$RELEASE_PROJECT_NAME"
          --version "$RELEASE_PROJECT_VERSION"
          --syft-version "$RELEASE_SYFT_VERSION"
      - name: Create release exactly once
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)"
          if [ "$tag_sha" != "$GITHUB_SHA" ]; then
            echo "release tag moved: expected $GITHUB_SHA, resolved $tag_sha" >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; refusing to replace its assets."
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            "dist/regressistor-$RELEASE_PROJECT_VERSION-py3-none-any.whl" \
            "dist/regressistor-$RELEASE_PROJECT_VERSION.tar.gz" \
            dist/SBOM.spdx.json \
            dist/SHA256SUMS \
            --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
