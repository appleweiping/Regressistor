schema_version = 1
case_keys = ["CORNER", "VDD", "TEMP_C"]
numeric_epsilon = 1e-15

[missing]
baseline_case = "error"
candidate_case = "error"
baseline_metric = "error"
candidate_metric = "error"

[[metrics]]
name = "gain_100khz"
unit = "1"
reduce = "mean"
severity = "error"
contract = { kind = "range", lower = 1.0, upper = 13.0 }
regression = { direction = "higher", relative_budget = 0.001, relative_floor = 1e-9 }

[[metrics]]
name = "output_pp_v"
unit = "V"
reduce = "mean"
severity = "error"
contract = { kind = "range", lower = 0.002, upper = 0.025 }
regression = { direction = "higher", relative_budget = 0.001, relative_floor = 1e-9 }

[[metrics]]
name = "output_v"
unit = "V"
reduce = "mean"
severity = "error"
contract = { kind = "range", lower = 0.2, upper = 3.2 }
regression = { direction = "higher", relative_budget = 0.001, relative_floor = 1e-9 }

[[metrics]]
name = "power_w"
unit = "W"
reduce = "mean"
severity = "error"
contract = { kind = "range", lower = 4e-5, upper = 4e-4 }
regression = { direction = "lower", relative_budget = 0.001, relative_floor = 1e-12 }

[[metrics]]
name = "supply_current_a"
unit = "A"
reduce = "mean"
severity = "error"
contract = { kind = "range", lower = 1.5e-5, upper = 1e-4 }
regression = { direction = "lower", relative_budget = 0.001, relative_floor = 1e-12 }
